<div class="ressources-container">

  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <button class="btn-back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Retour
      </button>
      <div class="header-title">
        <h1>Ressources pédagogiques</h1>
        <p class="subtitle">Consultez tous les supports et documents disponibles pour votre apprentissage</p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="ressources-content">

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Chargement des ressources...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && ressources.length === 0" class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 3h18v18H3z"/>
      </svg>
      <h3>Aucune ressource disponible</h3>
      <p>Pour le moment, il n'y a pas de documents ou supports pour ce cours.</p>
    </div>

    <!-- Resources Grid -->
    <div *ngIf="!loading && ressources.length > 0" class="ressources-grid">
      <div class="ressource-card" *ngFor="let r of ressources" (click)="openResource(r)">
        <div class="ressource-icon">
          <!-- PDF -->
          <svg *ngIf="r.type === 'PDF'" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
          </svg>
          <!-- VIDEO -->
          <svg *ngIf="r.type === 'VIDEO'" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10 8l6 4-6 4V8z"/>
            <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
          </svg>
          <!-- LIEN -->
          <svg *ngIf="r.type === 'LIEN'" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3.9 12a5 5 0 0 1 7.07-7.07l1.41 1.41-1.41 1.41a3 3 0 1 0 4.24 4.24l1.41-1.41 1.41 1.41A5 5 0 0 1 12.1 21a5 5 0 0 1-8.2-9z"/>
          </svg>
          <!-- DOCUMENT -->
          <svg *ngIf="r.type === 'DOCUMENT'" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
          </svg>
        </div>

        <div class="ressource-content">
          <div class="ressource-title">{{ r.titre }}</div>
          <div class="ressource-info">
            <span *ngIf="r.type === 'LIEN'">Lien externe</span>
            <span *ngIf="r.type !== 'LIEN'">{{ r.url | slice:0:25 }}...</span>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
